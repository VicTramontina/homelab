---
# One service per game. None of them auto-start (rule: games only start on
# explicit command) and none use `restart: always` (the whole point of
# this project is that the PC -- and therefore these containers -- spends
# most of its life powered off).
#
# HumanitZ has no first-party Docker image; this uses the community image
# indifferentbroccoli/humanitz-server-docker, which wraps SteamCMD
# (dedicated-server app id 2728330) and downloads the server into the
# mounted volume on first start (UPDATE_ON_START=true).
#
# ServerName / MaxPlayers / RCON settings are NOT configurable via env
# vars in this image -- they live in
# volumes/humanityz/HumanitZServer/GameServerSettings.ini, which the
# Ansible `docker` role manages via community.general.ini_file (RCONPass
# sourced from Ansible Vault). See docs/architecture.md.
#
# cs2, by contrast, IS fully env-var configured (its image regenerates
# any on-disk config from env vars on every start, so a pre-written file
# would just be overwritten). Since this file is committed to git as
# plain text, its secrets (RCON password, join password, GSLT) can't live
# directly in an `environment:` block here -- it loads a `<name>.env`
# file instead, rendered by Ansible from Vault into server/<name>.env
# (gitignored by the repo's blanket `*.env` rule) by
# roles/docker/tasks/games/<game_type>.yml. See docs/architecture.md.
#
# There is no port forwarding on the home router -- players reach the
# game port through the playit.gg tunnel (see the `playit-agent` Ansible
# role and docs/setup.md). RCON is never tunneled, only used locally by
# this project's own daemons, so its port is bound to loopback only. CS2
# is the one exception worth calling out: its dedicated server only
# speaks RCON on the main game port unless CS2_RCON_PORT is set, so this
# config sets it to move RCON off the publicly-tunneled port entirely
# (see cs2.env.j2) -- otherwise the RCON port itself would be internet-
# reachable behind just a password, not loopback-only like every other
# game here.
#
# The `logging` block below caps each container's log file (Docker's
# default json-file driver has NO size limit otherwise -- a long game
# session would otherwise let console output grow the disk unbounded).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  humanityz:
    image: indifferentbroccoli/humanitz-server-docker:latest
    platform: linux/amd64
    container_name: humanityz
    restart: "no"
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      PUID: "1000"
      PGID: "1000"
      UPDATE_ON_START: "true"
      PORT: "7777"
      # 27015 is CS2's main game port (see the cs2 service below) --
      # moved off the Source engine default to avoid the collision.
      QUERY_PORT: "27017"
    ports:
      - "7777:7777/udp"
      - "27017:27017/udp"
      - "127.0.0.1:8888:8888/tcp" # RCON, loopback-only, never tunneled
    volumes:
      - ./volumes/humanityz:/home/steam/server-files

  cs2:
    image: joedwards32/cs2:latest
    container_name: cs2
    restart: "no"
    stop_grace_period: 30s
    logging: *default-logging
    stdin_open: true # matches upstream's own compose example
    tty: true
    # Bridge networking (Docker's default, used by every other service
    # here) breaks CS2's own reliable-UDP layer: confirmed live that
    # inbound player packets get DNAT'd into the container correctly, but
    # come back out re-addressed as the bridge gateway (e.g. 172.18.0.1)
    # rather than the real client -- true with docker-proxy AND with
    # userland-proxy disabled, so it's Docker's bridge/MASQUERADE chain
    # itself, not the proxy implementation. Every connecting player got
    # "reply timeouts" climbing to a hard disconnect within ~10s. Host
    # networking sidesteps Docker's NAT for this container entirely.
    #
    # `ports:` is meaningless under host networking (the process binds
    # host ports directly per CS2_PORT/CS2_RCON_PORT in cs2.env) -- RCON
    # no longer gets Docker's loopback-only port mapping, so
    # ansible/roles/firewall protects it with a host iptables rule
    # instead. See docs/architecture.md.
    network_mode: host
    env_file:
      - ./cs2.env # server name/map, RCON+join secrets, GSLT -- see games/cs2.yml
    volumes:
      - ./volumes/cs2:/home/steam/cs2-dedicated

  # Windrose is a Windows-only server run under Wine by the community image
  # ghcr.io/uberdudepl/windrose-dedicated-server-docker (SteamCMD app
  # 4129620). Players connect through the playit.gg tunnel with
  # UseDirectConnection (TCP+UDP on windrose_port) instead of the game's
  # invite-code relay. Host networking, as upstream ships it and for the same
  # NAT reasons as cs2. There is no RCON: the player count comes from the
  # container logs (ansible/files/game_adapters/windrose.py). Ports are
  # offset from humanityz's 7777/udp so both can run at once. Server name,
  # password and limits are env-driven; the password lives in windrose.env
  # (see roles/docker/tasks/games/windrose.yml).
  windrose:
    image: ghcr.io/uberdudepl/windrose-dedicated-server-docker:v1.6.4
    container_name: windrose
    restart: "no"
    stop_grace_period: 90s
    logging: *default-logging
    network_mode: host
    env_file:
      - ./windrose.env
    volumes:
      - ./volumes/windrose/data:/data
      - ./volumes/windrose/steam-home:/home/steam

  # Unlike the game services above, netdata IS meant to run continuously
  # whenever the PC is on (restart: unless-stopped) -- it's monitoring the
  # PC itself, not a game session, so there's no "idle" concept for it.
  # The docker role starts it explicitly after provisioning; it isn't
  # covered by game-manager/activity-monitor.
  #
  # Bound to all interfaces like the game ports (not loopback-only like
  # RCON) because the whole point is to view the dashboard from another
  # machine on the LAN, at http://<hostname>.local:19999 -- safe under
  # the same "no port forwarding on the router" invariant documented in
  # docs/architecture.md. It is NOT authenticated, so don't tunnel this
  # port publicly (e.g. via playit.gg) the way the game ports are.
  #
  # /var/run/docker.sock is mounted read-only so netdata auto-discovers
  # and reports per-container stats for humanityz/cs2 alongside system
  # metrics, with no extra config.
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # MySQL for CS2 plugin data (K4-Arenas weapon/round preferences and stats).
  # Like netdata it runs continuously (restart: unless-stopped, started by the
  # docker role), not on demand like the games: Docker brings it back on every
  # boot, so it is always up before any game starts and cs2 needs no hard
  # depends_on (game-manager uses `docker compose start cs2`, which ignores
  # dependencies anyway). A plugin that cannot reach it only logs an error.
  #
  # Loopback only: cs2 runs with host networking and reaches it on
  # 127.0.0.1:3306; nothing else needs it, and it is never tunneled. The
  # credentials come from mysql.env, rendered by Ansible from the vault
  # (gitignored by the repo's blanket `*.env` rule). The database and user are
  # created on the first start of an empty volume only; changing the env
  # passwords later does not change an existing database.
  #
  # Small buffer pool and no performance schema: this is a handful of tiny
  # tables on a shared game box.
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./mysql.env
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=30
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./volumes/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
