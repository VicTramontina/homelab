---
# One service per game. None of them auto-start (rule: games only start on
# explicit command) and none use `restart: always` (the whole point of
# this project is that the PC -- and therefore these containers -- spends
# most of its life powered off).
#
# HumanitZ has no first-party Docker image; this uses the community image
# indifferentbroccoli/humanitz-server-docker, which wraps SteamCMD
# (dedicated-server app id 2728330) and downloads the server into the
# mounted volume on first start (UPDATE_ON_START=true).
#
# ServerName / MaxPlayers / RCON settings are NOT configurable via env
# vars in this image -- they live in
# volumes/humanityz/HumanitZServer/GameServerSettings.ini, which the
# Ansible `docker` role manages via community.general.ini_file (RCONPass
# sourced from Ansible Vault). See docs/architecture.md.
#
# There is no port forwarding on the home router -- players reach the
# game port through the playit.gg tunnel (see the `playit-agent` Ansible
# role and docs/setup.md). RCON is never tunneled, only used locally by
# this project's own daemons, so its port is bound to loopback only.
services:
  humanityz:
    image: indifferentbroccoli/humanitz-server-docker:latest
    platform: linux/amd64
    container_name: humanityz
    restart: "no"
    stop_grace_period: 30s
    environment:
      PUID: "1000"
      PGID: "1000"
      UPDATE_ON_START: "true"
      PORT: "7777"
      QUERY_PORT: "27015"
    ports:
      - "7777:7777/udp"
      - "27015:27015/udp"
      - "127.0.0.1:8888:8888/tcp" # RCON, loopback-only, never tunneled
    volumes:
      - ./volumes/humanityz:/home/steam/server-files
