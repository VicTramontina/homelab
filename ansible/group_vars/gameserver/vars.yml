---
# Non-secret configuration for the gameserver host. Secrets referenced
# here (vault_*) live in an ansible-vault-encrypted vault.yml -- see
# vault.yml.example in this same directory.
homelab_dir: /opt/homelab
r2_bucket: homelab-backups
r2_endpoint: "https://0da20363209addd5e807f623ac74e3c2.r2.cloudflarestorage.com"
backups_to_keep: 3
aio_username: victortramontina

# One entry per supported game. Adding a new game to the whole project
# means: add a Docker Compose service, add an entry here, add a
# vault_rcon_pass_<name> secret, and add a choice in discord-bot/src/commands.js.
#
# game_type identifies which per-game "adapter" this entry uses -- the
# config-file generator in ansible/roles/docker/tasks/games/<game_type>.yml
# and the RCON player-count adapter in ansible/files/game_adapters/<game_type>.py.
# Several games can share a game_type if they're the same underlying server
# software (e.g. a modded variant). A game with no existing adapter needs a
# new games/<game_type>.yml and game_adapters/<game_type>.py -- see
# docs/architecture.md.
games:
  humanityz:
    label: HumanityZ
    game_type: humanityz
    compose_service: humanityz
    rcon_host: 127.0.0.1
    rcon_port: 8888
    max_players: 16
    volume_path: "{{ homelab_dir }}/server/volumes/humanityz"

  cs2:
    label: CS2
    game_type: cs2
    compose_service: cs2
    rcon_host: 127.0.0.1
    # CS2's dedicated server only speaks RCON on the main game port
    # (27015, publicly tunneled) unless CS2_RCON_PORT says otherwise --
    # this moves it to its own loopback-only port instead. See
    # server/docker-compose.yml.
    rcon_port: 27016
    max_players: 10
    volume_path: "{{ homelab_dir }}/server/volumes/cs2"
    # No backup: the volume is a ~70GB SteamCMD install, not save data --
    # tar-ing it took nearly an hour and blocked game-manager's single
    # MQTT processing thread the whole time (confirmed live: a queued
    # /start for another game didn't run until the backup finished).
    # config.json.j2 defaults `backup` to true when a game omits it, so
    # every other game keeps backing up without needing this key at all.
    backup: false
    # game_type-specific knobs, read by games/cs2.yml /
    # templates/games/cs2.env.j2 only -- the generic Python daemons never
    # look at these.
    # Starts on a Workshop map instead of a stock Valve one (see cs2_maps).
    # Set to "" to fall back to cs2_start_map below.
    cs2_start_workshop_id: "3070665979" # bhop_emevaelx3
    cs2_start_map: de_inferno
    cs2_game_alias: competitive

  windrose:
    label: Windrose
    game_type: windrose
    compose_service: windrose
    max_players: 4
    # Back up only the saves: the rest of the volume is the SteamCMD-installed
    # server plus the Wine prefix (several GB, not save data).
    volume_path: "{{ homelab_dir }}/server/volumes/windrose/data/R5/Saved"
    windrose_port: 7780
    windrose_query_port: 7781

# Metamod:Source and plugins, installed by the generated pre.sh
# (roles/docker/templates/games/cs2-pre.sh.j2) on container start. Pinned on
# purpose: bump a URL to upgrade; the marker file makes the change reinstall
# just that entry. `subdir` is the folder inside the archive to copy from;
# `dest` is relative to game/csgo. CS2 runs on Steam Runtime 4.
#
# Status after CS2 1.41.8.2 (2026-09-22), tested live on 2026-09-24:
#   - CounterStrikeSharp 1.0.375 (first release with the official fix, PR
#     roflmuffin/CounterStrikeSharp #1433) needs Metamod's SourceHook API 18,
#     hence Metamod 1469. 1.0.374 aborted the server with a core dump when the
#     first player connected, even with the community gamedata patch (#1432).
#   - NOT installed: MovementUnlocker v2.0 segfaults at boot on this build.
#     Re-add https://github.com/Source2ZE/MovementUnlocker (steamrt4 tarball)
#     when a newer release exists.
#   - Installed but failing to load (harmless): RampBugFix 5-1 and STFixes
#     10-22, "undefined symbol g_bUpdateStringTokenDatabase" (built against an
#     older tier0).
#   - SharpTimer 0.4.0 loads but reports "RunCommand hook failed. Signature is
#     likely outdated": its timer movement features stay off until upstream
#     updates stgamedata.json.
#
# cs2_css_enabled is the kill switch for the whole CounterStrikeSharp layer:
# while false, pre.sh renames counterstrikesharp.vdf so Metamod doesn't load
# it (and none of its plugins run). Turn it off first if players get dropped
# right after connecting, to separate a plugin problem from a network one.
cs2_css_enabled: true

# CounterStrikeSharp plugins kept installed but moved to plugins/disabled/ by
# pre.sh (CSS does not load that folder). Bisected live on 2026-09-24: with
# CSS 1.0.375 the server core-dumps when the first player connects while
# K4-Arenas and/or SharpTimer are loaded, and is stable without them (core
# only, and core + Tags + GG1MapChooser + Map-Configs, both with players
# connected). Remove a name from this list to enable it again.
cs2_disabled_plugins:
  - K4-Arenas
  - SharpTimer

cs2_addons:
  - name: metamod
    url: https://github.com/alliedmodders/metamod-source/releases/download/2.0.0.1469/mmsource-2.0.0-git1469-linux.tar.gz
  - name: counterstrikesharp
    url: https://github.com/roflmuffin/CounterStrikeSharp/releases/download/v1.0.375/counterstrikesharp-with-runtime-linux-1.0.375.zip
  - name: movementunlocker
    url: https://github.com/Source2ZE/MovementUnlocker/releases/download/v2.0.1/MovementUnlocker-v2.0.1-steamrt4.tar.gz
  - name: rampbugfix
    url: https://github.com/Interesting-exe/CS2Fixes-RampbugFix/releases/download/5-1/CS2Fixes-RampbugFix-5-1-linux.tar.gz
  - name: stfixes
    url: https://github.com/SharpTimer/STFixes-metamod/releases/download/10-22/stfixes-metamod-10-22-linux.zip
  - name: cs2-tags
    url: https://github.com/CounterStrike2-Plugins-Archive/cs2-tags/releases/download/v1.15/cs2-tags-v1.15.zip
    dest: addons/counterstrikesharp
  - name: sharptimer
    url: https://github.com/Letaryat/poor-sharptimer/releases/download/v0.4.0/SharpTimer-v0.4.0.zip
    subdir: SharpTimer-v0.4.0
  - name: k4-arenas
    url: https://github.com/K4ryuu/K4-Arenas/releases/download/v2.0.8/K4-Arenas.zip
    subdir: K4-Arenas
    dest: addons/counterstrikesharp
  # Runs cfg/Map-Configs-GoldKingZ/<map prefix>.cfg per map and can load or
  # unload plugins per map (gkz_load / gkz_unload): this is what makes the
  # mode follow the map, since CS2 never auto-executes a loose per-map cfg.
  - name: map-configs
    url: https://github.com/oqyh/cs2-Map-Configs-GoldKingZ/releases/download/1.0.7/Map-Configs-GoldKingZ.1.0.7.zip
  # !rtv, !nominate, !rtm (vote the pool), admin map change; one pool per mode
  # generated from cs2_maps (templates/games/GGMCmaps.json.j2). Workshop maps
  # by id, actively maintained (v1.8.0, 2026-05).
  - name: gg1mapchooser
    url: https://github.com/ssypchenko/GG1MapChooser/releases/download/v1.8.0/GG1MapChooser.1.8.0.zip
    subdir: csgo

# Map catalog used by `cs2-mode <map name>` (roles/docker/templates/games/
# cs2-mode.py.j2): name -> Steam Workshop id plus the mode it plays in. Picked
# by lifetime subscriptions on the CS2 Workshop; SharpTimer already ships zone
# data for bhop_emevaelx3, bhop_internetclub, surf_kitsune and surf_nyx. The
# mode really applied on map load comes from the prefix cfgs in
# roles/docker/files/cs2/cfg/Map-Configs-GoldKingZ/ (bhop_, surf_, aim_, am_),
# so a new map only needs its prefix to be one of those. Names are the maps'
# internal names, verified by loading each one on the server.
cs2_maps:
  bhop:
    bhop_emevaelx3: "3070665979"
    bhop_dunedash: "3118806244"
    bhop_arcane: "3260506171"
    bhop_internetclub: "3103286752"
    bhop_colour: "3071726325"
    bhop_arcturus: "3088973190"
  surf:
    surf_utopia_njv: "3073875025"
    surf_kitsune: "3076153623"
    surf_boreas: "3133346713"
    surf_nyx: "3129698096"
    surf_beginner: "3070321829"
    surf_rookie: "3082548297"
  arena:
    aim_redline: "3139172262"
    am_italy_p: "3452445755"
    aim_gryn: "3344448932"

# Map name prefix -> mode cfg (cfg/homelab/modes/<mode>.cfg). Used by the
# cs2-modes watcher, which re-applies the mode after every map load. Keep in
# sync with the prefix cfgs in overlay/cfg/Map-Configs-GoldKingZ/, which set
# game_type/game_mode early (Map-Configs restarts the map when they change).
cs2_mode_prefixes:
  bhop_: bhop
  surf_: surf
  aim_: arena
  am_: arena
  de_: default
  cs_: default

# Ports that need host-level firewall protection (ansible/roles/firewall)
# because their game service runs with `network_mode: host` in
# server/docker-compose.yml -- Docker's own loopback-only port mapping
# (`127.0.0.1:<port>:<port>`) doesn't apply under host networking.
host_network_rcon_ports:
  - 27016 # cs2 RCON (CS2_RCON_PORT)
