---
# Non-secret configuration for the gameserver host. Secrets referenced
# here (vault_*) live in an ansible-vault-encrypted vault.yml -- see
# vault.yml.example in this same directory.
homelab_dir: /opt/homelab
r2_bucket: homelab-backups
r2_endpoint: "https://0da20363209addd5e807f623ac74e3c2.r2.cloudflarestorage.com"
backups_to_keep: 3
aio_username: victortramontina

# One entry per supported game. Adding a new game to the whole project
# means: add a Docker Compose service, add an entry here, add a
# vault_rcon_pass_<name> secret, and add a choice in discord-bot/src/commands.js.
#
# game_type identifies which per-game "adapter" this entry uses -- the
# config-file generator in ansible/roles/docker/tasks/games/<game_type>.yml
# and the RCON player-count adapter in ansible/files/game_adapters/<game_type>.py.
# Several games can share a game_type if they're the same underlying server
# software (e.g. a modded variant). A game with no existing adapter needs a
# new games/<game_type>.yml and game_adapters/<game_type>.py -- see
# docs/architecture.md.
games:
  humanityz:
    label: HumanityZ
    game_type: humanityz
    compose_service: humanityz
    rcon_host: 127.0.0.1
    rcon_port: 8888
    max_players: 16
    volume_path: "{{ homelab_dir }}/server/volumes/humanityz"

  cs2:
    label: CS2
    game_type: cs2
    compose_service: cs2
    rcon_host: 127.0.0.1
    # CS2's dedicated server only speaks RCON on the main game port
    # (27015, publicly tunneled) unless CS2_RCON_PORT says otherwise --
    # this moves it to its own loopback-only port instead. See
    # server/docker-compose.yml.
    rcon_port: 27016
    max_players: 10
    volume_path: "{{ homelab_dir }}/server/volumes/cs2"
    # No backup: the volume is a ~70GB SteamCMD install, not save data --
    # tar-ing it took nearly an hour and blocked game-manager's single
    # MQTT processing thread the whole time (confirmed live: a queued
    # /start for another game didn't run until the backup finished).
    # config.json.j2 defaults `backup` to true when a game omits it, so
    # every other game keeps backing up without needing this key at all.
    backup: false
    # game_type-specific knobs, read by games/cs2.yml /
    # templates/games/cs2.env.j2 only -- the generic Python daemons never
    # look at these.
    cs2_start_map: de_inferno
    cs2_game_alias: competitive

# Metamod:Source and plugins, installed by the generated pre.sh
# (roles/docker/templates/games/cs2-pre.sh.j2) on container start. Pinned on
# purpose: bump a URL to upgrade; the marker file makes the change reinstall
# just that entry. `subdir` is the folder inside the archive to copy from;
# `dest` is relative to game/csgo. CS2 runs on Steam Runtime 4.
cs2_addons:
  - name: metamod
    url: https://github.com/alliedmodders/metamod-source/releases/download/2.0.0.1469/mmsource-2.0.0-git1469-linux.tar.gz

# PENDING -- every plugin below was tested live on CS2 1.41.8.2 (2026-09-22)
# and is broken by that update, so none is installed yet:
