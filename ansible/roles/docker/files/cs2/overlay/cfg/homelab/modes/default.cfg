// Vanilla competitive. Applied to stock maps (de_, cs_).
// Self-contained: sets every knob so it works after any other mode.
game_type 0  // game type: 0 classic, 1 gun game/deathmatch group
game_mode 1
mp_timelimit 0  // minutes per map before the GG1MapChooser vote (0 = none)
mp_maxrounds 24
mp_roundtime 1.92
mp_freezetime 15
mp_warmuptime 30
mp_team_intro_time 6.5  // team intro cinematic
mp_ignore_round_win_conditions 0  // 1 = rounds never end
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_respawn_immunitytime -1  // seconds of spawn protection
sv_airaccelerate 12  // air control (12 vanilla)
sv_enablebunnyhopping 0  // allow speed above 1.1x max
sv_autobunnyhopping 0  // hold jump to keep hopping
sv_gravity 800
sv_maxvelocity 3500
sv_falldamage_scale 1
mp_damage_scale_ct_body 1  // 0 = invincible
mp_damage_scale_ct_head 1
mp_damage_scale_t_body 1
mp_damage_scale_t_head 1
mp_teammates_are_enemies 0  // 1 = free for all
mp_solid_teammates 1  // 0 = players walk through teammates
mp_humanteam any  // CT puts every human on one team, so nobody collides or fights
mp_autoteambalance 1
mp_limitteams 2
mp_friendlyfire 1
mp_startmoney 800
mp_buy_anywhere 0
mp_free_armor 0
mp_death_drop_gun 1
sv_infinite_ammo 0
mp_dm_time_between_bonus_min 30  // deathmatch bonus weapon: huge = never (hides its HUD)
mp_dm_time_between_bonus_max 40
mp_dm_healthshot_killcount 3
bot_quota 0
