---
# Config-file generation for game_type "cs2" (joedwards32/cs2 image).
# Every setting this image exposes is env-var driven (there's no on-disk
# config file to template), so this renders a *.env file (gitignored by
# the repo's blanket `*.env` rule) with the settings docker-compose.yml
# can't hold directly as plain text: the RCON password, the optional join
# password, and the Steam Game Server Login Token (GSLT).
#
# Unlike humanityz.yml's image, this one does NOT chown the mounted
# volume itself, so this sets ownership explicitly -- to uid/gid 999:988,
# confirmed against a live container (`docker inspect cs2 --format
# '{{.Config.User}}'` prints "999:988"). The image's own docs describe
# this as uid 1000 ("steam"), which is wrong for the version tested here;
# trust the live container over the docs if this ever needs re-checking.
- name: "[{{ game_name }}] Create CS2 volume directory"
  ansible.builtin.file:
    path: "{{ game.volume_path }}"
    state: directory
    mode: "0755"
    owner: "999"
    group: "988"

- name: "[{{ game_name }}] Render CS2 env file (server name/map, RCON/join secrets, GSLT)"
  ansible.builtin.template:
    src: games/cs2.env.j2
    dest: "{{ homelab_dir }}/server/{{ game_name }}.env"
    mode: "0600"
  no_log: true

# pre.sh is sourced by the image's entrypoint on every start (it only seeds
# its own no-op copy when the file is missing), so ours wins. It installs
# Metamod and whatever else is listed in cs2_addons.
- name: "[{{ game_name }}] Render pre.sh (addon installer)"
  ansible.builtin.template:
    src: games/cs2-pre.sh.j2
    dest: "{{ game.volume_path }}/pre.sh"
    mode: "0755"
    owner: "999"
    group: "988"

# The cfg directory only exists once SteamCMD has installed the game, so
# create each level with the container's ownership on a fresh volume.
- name: "[{{ game_name }}] Create cfg directories"
  ansible.builtin.file:
    path: "{{ game.volume_path }}/{{ item }}"
    state: directory
    mode: "0755"
    owner: "999"
    group: "988"
  loop:
    - game
    - game/csgo
    - game/csgo/cfg
    - game/csgo/cfg/homelab
    - game/csgo/cfg/homelab/modes

- name: "[{{ game_name }}] Install mode configs (bhop, surf, arena...)"
  ansible.builtin.copy:
    src: "cs2/cfg/homelab/modes/"
    dest: "{{ game.volume_path }}/game/csgo/cfg/homelab/modes/"
    mode: "0644"
    owner: "999"
    group: "988"

- name: "[{{ game_name }}] Install cs2-mode (switch mode/map over RCON)"
  ansible.builtin.template:
    src: games/cs2-mode.py.j2
    dest: /usr/local/bin/cs2-mode
    mode: "0755"
