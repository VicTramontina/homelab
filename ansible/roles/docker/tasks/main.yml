---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Determine dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false

- name: Determine distribution codename
  ansible.builtin.command: lsb_release -cs
  register: distro_codename
  changed_when: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ distro_codename.stdout }} stable"
    state: present
    filename: docker

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

# Cap journald explicitly rather than relying on distro defaults -- this
# is an unattended box nobody's watching for a full disk, and our own
# services (status-daemon, game-manager, activity-monitor) all log to
# it via systemd/journald.
- name: Cap systemd journal size
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: "^#?SystemMaxUse="
    line: "SystemMaxUse=200M"
  notify: Restart journald

- name: Create homelab base directory
  ansible.builtin.file:
    path: "{{ homelab_dir }}"
    state: directory
    mode: "0755"

- name: Create server directories (compose, volumes, backups)
  ansible.builtin.file:
    path: "{{ homelab_dir }}/server/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - volumes
    - backups

- name: Copy Docker Compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../server/docker-compose.yml"
    dest: "{{ homelab_dir }}/server/docker-compose.yml"
    mode: "0644"

- name: Copy netdata config (metrics retention)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../server/netdata.conf"
    dest: "{{ homelab_dir }}/server/netdata.conf"
    mode: "0644"

- name: Render shared homelab config.json
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/config.json.j2"
    dest: "{{ homelab_dir }}/config.json"
    mode: "0600"

# Each game's on-disk config file (format, section names, key names --
# whatever its server software expects) is generated by a per-game task
# file in games/<game_type>.yml, matched to the games.<name>.game_type
# set in group_vars/gameserver/vars.yml. A game_type with nothing to
# template still needs a games/<game_type>.yml file, even an empty one
# (`---` with no tasks) -- see docs/architecture.md.
#
# loop_var is renamed to game_entry (default is `item`) because the
# per-game task files loop too (e.g. over ini_file options), and two
# nested loops both named `item` corrupt outer task-level vars under
# ansible-core's loop templating -- see loop_control docs on loop_var.
- name: Generate per-game server config files
  ansible.builtin.include_tasks:
    file: "games/{{ game_entry.value.game_type }}.yml"
  loop: "{{ games | dict2items }}"
  loop_control:
    loop_var: game_entry
    label: "{{ game_entry.key }}"
  vars:
    game_name: "{{ game_entry.key }}"
    game: "{{ game_entry.value }}"

- name: Create MySQL data directory
  ansible.builtin.file:
    path: "{{ homelab_dir }}/server/volumes/mysql"
    state: directory
    mode: "0755"

- name: Render MySQL env file (root and K4-Arenas passwords)
  ansible.builtin.template:
    src: mysql.env.j2
    dest: "{{ homelab_dir }}/server/mysql.env"
    mode: "0600"
  no_log: true

- name: Create Docker Compose services without starting them
  ansible.builtin.command:
    cmd: docker compose -f {{ homelab_dir }}/server/docker-compose.yml up --no-start
    chdir: "{{ homelab_dir }}/server"
  changed_when: true

# netdata is the one compose service meant to run continuously while the
# PC is on (restart: unless-stopped covers it across reboots/wake-ups
# from here on) -- unlike the game services, it's not started on-demand
# by game-manager, so it needs its own explicit start here.
- name: Start netdata
  ansible.builtin.command:
    cmd: docker compose -f {{ homelab_dir }}/server/docker-compose.yml up -d netdata
    chdir: "{{ homelab_dir }}/server"
  changed_when: true
