[gameserver]
# Use the real IP for the first run (mDNS isn't installed until the
# `mdns` role runs). After that, switch ansible_host to <hostname>.local
# (e.g. bigaserver.local) -- it'll keep working across router/DHCP
# changes, unlike a hardcoded IP.
gameserver-pc ansible_host=192.168.0.101 ansible_user=ubuntu

[gameserver:vars]
ansible_python_interpreter=/usr/bin/python3
